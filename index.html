<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0"> -->
    <link rel="apple-touch-icon" href="./icons/app-icon.jpg">
    <!-- Говорим iOS, что это веб-приложение -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <!-- Цвет статусной строки (черный, белый или прозрачный) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <!-- Название, которое будет под иконкой на рабочем столе -->
    <meta name="apple-mobile-web-app-title" content="Deutsch">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Document</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <header>
        <div class="header-date-box">
            <p class="header-date-p">01.01.26</p>
        </div>
        <div class="header-bar-box">
            <p class="header-bar-p">1/60</p>
        </div>
    </header>
    <main>
        <div class="main-get-box">
            <button class="main-get-button">get today's leson</button>
        </div>
        <div class="m-box hidden">
            <section class="m-day">
                <p class = 'm-day-day-p'></p>
                <p class = 'm-day-type-p'></p>
            </section>
            <section class="m-topic">
                <p class="m-topic-p"></p>
            </section>
            <section class="m-time">
                <p class="m-time-video-p"></p>
                <p class="m-time-grammar-p"></p>
                <p class="m-time-words-p"></p>
                <div class="m-time-get-box">
                    <button class="m-time-get-btn">Copy</button>
                </div>
            </section>
            <section class="m-buttons">
                <button class="m-buttons-cancel-btn">Cancel</button>
                <button class="m-buttons-complete-btn">Complete</button>
            </section>
        </div>
    </main>
    
    <script src="script.js"></script>
</body>
</html>
